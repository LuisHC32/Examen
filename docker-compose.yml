services:
  db:
    image: postgres:16
    container_name: ventasfix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ventasfix
      POSTGRES_PASSWORD: ventasfix
      POSTGRES_DB: ventasfix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventasfix -d ventasfix"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: ./api
    container_name: ventasfix-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://ventasfix:ventasfix@db:5432/ventasfix
      JWT_SECRET: ventasfix-jwt-secret-minimo-32-caracteres
      NODE_ENV: production
      PORT: 3001
      UPLOADS_DIR: /app/uploads
      COOKIE_SECURE: "false"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    container_name: ventasfix-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
