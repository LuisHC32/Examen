services:
  db:
    image: postgres:16
    container_name: ventasfix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ventasfix
      POSTGRES_PASSWORD: ventasfix
      POSTGRES_DB: ventasfix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventasfix -d ventasfix"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    container_name: ventasfix-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ventasfix:ventasfix@db:5432/ventasfix
      JWT_SECRET: ventasfix-jwt-secret-minimo-32-caracteres
      NODE_ENV: production
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
